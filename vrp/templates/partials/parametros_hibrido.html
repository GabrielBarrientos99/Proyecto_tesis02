<form id="form-hibrido" class="space-y-4">
    <div class="bg-gray-50 p-4 rounded border">
      <h3 class="text-sm font-semibold text-gray-700 mb-2">Parámetros ACO</h3>
      <div class="grid grid-cols-2 gap-4">
        <input type="number" name="aco_num_ants" placeholder="Hormigas" class="p-2 border rounded">
        <input type="number" name="aco_iter" placeholder="Iteraciones" class="p-2 border rounded">
        <input type="number" step="0.1" name="aco_alpha" placeholder="Alpha" class="p-2 border rounded">
        <input type="number" step="0.1" name="aco_beta" placeholder="Beta" class="p-2 border rounded">
      </div>
      <div class="flex items-center mt-2">
        <input type="checkbox" name="aco_opt2" id="aco_opt2" class="mr-2">
        <label for="aco_opt2" class="text-sm text-gray-700">ACO con 2-opt</label>
      </div>
    </div>
  
    <div class="bg-gray-50 p-4 rounded border">
      <h3 class="text-sm font-semibold text-gray-700 mb-2">Parámetros AG</h3>
      <div class="grid grid-cols-2 gap-4">
        <input type="number" name="ag_population" placeholder="Población" class="p-2 border rounded">
        <input type="number" name="ag_generaciones" placeholder="Generaciones" class="p-2 border rounded">
        <input type="number" step="0.01" name="ag_mutation" placeholder="Mutación" class="p-2 border rounded">
      </div>
      <div class="flex items-center mt-2 space-x-2">
        <input type="checkbox" name="elitism" id="elitism_h" class="mr-2">
        <label for="elitism_h" class="text-sm text-gray-700">Elitismo</label>
      </div>
    </div>
  
    <div class="flex items-center mt-4 space-x-2">
      <input type="checkbox" name="usar_poblacion_aco" id="usar_poblacion_aco">
      <label for="usar_poblacion_aco" class="text-sm text-gray-700">Usar población de ACO como inicial para AG</label>
    </div>
  </form>
