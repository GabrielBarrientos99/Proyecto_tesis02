<form id="form-aco" class="space-y-4">
  {% csrf_token %}
  <!-- Parámetros principales -->
  <div><label class="block text-sm font-bold text-gray-700">Instancia</label>
    <select name="instancia" class="w-full p-2 border rounded">
      {% for categoria, archivos in instancias.items %}
        <optgroup label="{{ categoria }}">
          {% for archivo in archivos %}
            <option value="{{ archivo }}">{{ archivo }}</option>
          {% endfor %}
        </optgroup>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-sm font-bold text-gray-700">Nombre del experimento</label>
    <input type="text" name="nombre_estrategia" required placeholder="Ej: AG-2OPT-TOP" class="w-full p-2 border rounded">
  </div>
  <div>
    <label class="block text-sm text-gray-700 font-bold">Número de Hormigas</label>
    <input type="number" name="num_ants" class="w-full p-2 border border-gray-300 rounded">
  </div>
  <div>
    <label class="block text-sm text-gray-700 font-bold">Iteraciones</label>
    <input type="number" name="max_iter" class="w-full p-2 border border-gray-300 rounded">
  </div>
  <div>
    <label class="block text-sm text-gray-700 font-bold">Alpha</label>
    <input type="number" step="0.1" name="alpha" class="w-full p-2 border border-gray-300 rounded">
  </div>
  <div>
    <label class="block text-sm text-gray-700 font-bold">Beta</label>
    <input type="number" step="0.1" name="beta" class="w-full p-2 border border-gray-300 rounded">
  </div>
  <div>
    <label class="block text-sm text-gray-700 font-bold">Tasa de Evaporación</label>
    <input type="number" step="0.01" name="evaporation_rate" class="w-full p-2 border border-gray-300 rounded">
  </div>

  <!-- Flags -->
  <div>
    <label class="block text-sm text-gray-700 font-bold">Estrategia 2-opt</label>
    <select name="estrategia_2opt" class="w-full p-2 border border-gray-300 rounded">
      <option value="NO_2OPT">No aplicar</option>
      <option value="ALL">Todas las hormigas</option>
      <option value="STUCK">Si se estanca</option>
      <option value="LAST">Última hormiga</option>
    </select>
  </div>
  <div class="flex items-center space-x-2">
    <input type="checkbox" name="usar_swap" id="usar_swap">
    <label for="usar_swap" class="text-sm text-gray-700">Usar Swap</label>
  </div>
  <div class="flex items-center space-x-2">
    <input type="checkbox" name="reinicio_adaptativo" id="reinicio_adaptativo">
    <label for="reinicio_adaptativo" class="text-sm text-gray-700">Reinicio Adaptativo</label>
  </div>
  <div class="flex items-center space-x-2">
    <input type="checkbox" name="restriccion_nodos" id="restriccion_nodos" checked>
    <label for="restriccion_nodos" class="text-sm text-gray-700">Restricción de Nodos</label>
  </div>
  <div class="flex items-center space-x-2">
    <input type="checkbox" name="ajuste_dinamico" id="ajuste_dinamico" checked>
    <label for="ajuste_dinamico" class="text-sm text-gray-700">Ajuste Dinámico</label>
  </div>

  <div>
    <label class="block text-sm text-gray-700 font-bold">Número de repeticiones</label>
    <input type="number" name="num_repeticiones" value="1" class="w-full p-2 border rounded">
  </div>
</form>
